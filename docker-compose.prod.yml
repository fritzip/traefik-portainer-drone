# Production overlay — Let's Encrypt via ACME TLS challenge.
# Requires a publicly reachable FQDN in .env (DOMAIN_NAME, USER_EMAIL).
# Uses host networking so Traefik sees real client IPs on the VPS.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (or via: make up-prod)

services:
  traefik:
    # Switch to host networking for real client IPs on a VPS.
    # This overrides the port mappings in the base compose file.
    network_mode: host
    ports: !reset []
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--entryPoints.api.address=:8080"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.watch=true"
      - "--providers.docker.network=traefik"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--log.format=common"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.asDefault=true"
      - "--entryPoints.websecure.http.tls=true"
      - "--entryPoints.websecure.http.middlewares=auth-chain@file"
      - "--entryPoints.websecure.http.tls.certResolver=letsencrypt"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=7200s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=7200s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=1800s"
      - "--certificatesResolvers.letsencrypt.acme.email=${USER_EMAIL}"
      - "--certificatesResolvers.letsencrypt.acme.storage=/etc/traefik/acme.json"
      - "--certificatesResolvers.letsencrypt.acme.keyType=EC384"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    # Merges with base volumes — adds the ACME storage file.
    volumes:
      - ./traefik-config/acme.json:/etc/traefik/acme.json
    # Merges with base labels — adds the certresolver to each router.
    labels:
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"

  portainer:
    labels:
      - "traefik.http.routers.portainer.tls.certresolver=letsencrypt"
