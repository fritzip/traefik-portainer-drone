services:
  # Main Traefik proxy.
  # This base configuration uses mkcert local certificates (no ACME) and explicit port
  # mappings, which work correctly with Docker Desktop / WSL2.
  # For production on a real VPS (host networking + Let's Encrypt), use:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      - traefik
    command:
      - "--global.sendAnonymousUsage=false"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--entryPoints.api.address=:8080"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.network=traefik"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--log.format=common"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--entryPoints.websecure.asDefault=true"
      - "--entryPoints.websecure.http.tls=true"
      - "--entryPoints.websecure.http.middlewares=auth-chain@file"
      - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=7200s"
      - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=7200s"
      - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=1800s"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-config/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik-config/certs:/etc/certs:ro
      - /var/log/traefik:/var/log/traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN_NAM\
        E:-docker.localhost}`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.middlewares.traefik-auth.basicauth.users=${TRAEFIK_USERNA\
        ME}:${TRAEFIK_PASSWORD}"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth"
      - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

  error_pages:
    image: ttrafelet/traefik_error_pages
    container_name: error_pages
    restart: always
    ports:
      - "5551:5000"
    tmpfs:
      - /home/flask
    networks:
      - traefik

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    command: -H unix:///var/run/docker.sock
    restart: always
    depends_on:
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer-data:/data
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.rule=Host(`portainer.${DOMAIN_NAME:-doc\
        ker.localhost}`)"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.routers.portainer.middlewares=serve-pretty-errors@file"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

networks:
  traefik:
    external: true
